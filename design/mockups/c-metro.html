<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unificador · C · Metro</title>
<link rel="stylesheet" href="shared.css">
<style>
:root {
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; --mono: "Cascadia Mono", Consolas, monospace; --serif: Georgia, "Times New Roman", serif;
  --bg: #f5f0e6; --bg-2: #fbf8f1; --panel: #fbf8f1; --bubble: #ece5d6;
  --ink: #221d15; --ink-2: #6c6353; --ink-3: #b9afa0; --line: #e2d9c7; --line-2: #c9bea9;
  --approve: #e89a0c; --approve-ink: #241700; --plus: #1a7a47; --minus: #b53a2c; --chat-w: 400px;
}
/* Cabecera del chat a color completo: la IA se ve sin buscarla. */
.chat { border-right: 1px solid var(--line); }
.chat-head { background: var(--ai-fill); color: #fff; padding: 14px 16px 6px; transition: background .25s; }
.chat-head .crumb-p, .chat-head .crumb-sep, .chat-head .run-state { color: rgb(255 255 255 / .85); }
.chat-head .crumb-t select { color: #fff; }
.chat-head .crumb i { box-shadow: 0 0 0 1.5px #fff; }
.chat-head .run-state::before, .chat-head .run-state.on::before { background: #fff; }
.chat-head .run-state.on { color: #fff; }
.ai-bar { background: var(--ai-fill); padding: 6px 16px 14px; transition: background .25s; }
.prov { color: #fff; font-family: var(--serif); font-size: 14px; font-weight: 400; border: 1px solid rgb(255 255 255 / .35); }
.prov i { color: #fff; }
.prov:hover { background: rgb(255 255 255 / .16); color: #fff; }
.prov.on { background: #fbf8f1; color: var(--ink); font-weight: 700; border-color: transparent; }
.prov.on i { color: var(--f); }
.ai-subs label { color: rgb(255 255 255 / .85); }
.ai-subs select { background: rgb(0 0 0 / .18); border-color: rgb(255 255 255 / .3); color: #fff; }
.msg.ai p, .card strong { font-family: var(--serif); }
.msg.ai p { font-size: 15px; }
.send { border-radius: 20px; }

.topbar { border-bottom: 1px solid var(--line); }
.legend { border-top: 1px solid var(--line); }
.tab { font-family: var(--serif); font-size: 14px; font-weight: 400; }
.tab.on { font-weight: 700; }
.dr-head h2 { font-family: var(--serif); font-weight: 400; font-size: 23px; }

.map { padding: 18px 24px 40px; min-width: max-content; }
.line-block { margin-bottom: 26px; }
.line-title { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
.line-title button { font: 400 25px/1.2 var(--serif); }
.line-title button:hover { text-decoration: underline; text-decoration-thickness: 2px; text-decoration-color: var(--p); }
.line-title span { font-size: 12px; color: var(--ink-2); }
svg { display: block; overflow: visible; }
svg .hit { cursor: pointer; }
svg .hit:hover .ring { stroke-width: 5; }
svg text { font-family: var(--font); fill: var(--ink); }
svg .id { font: 500 10.5px var(--mono); fill: var(--ink-2); }
svg .ph-l { font-size: 11.5px; fill: var(--ink-2); font-weight: 600; }
svg .th-n { font-size: 13px; font-weight: 700; cursor: pointer; }
.stn-label { font-size: 12px; line-height: 1.2; color: var(--ink); text-align: center; pointer-events: none; }
.stn-label.quiet { color: var(--ink-2); }
.stn-label.flag { font-weight: 700; }
.pulse { animation: mpulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes mpulse { from { transform: scale(.75); opacity: .75; } to { transform: scale(1.8); opacity: 0; } }
.orbit { animation: spin 1.2s linear infinite; transform-box: fill-box; transform-origin: center; }
.drawer { background: var(--panel); }
</style>
</head>
<body>
<div class="app">
  <aside class="chat" id="chat" aria-label="Chat"></aside>
  <main class="stage">
    <div class="topbar" id="tabs"></div>
    <div class="canvas" id="canvas"></div>
    <div class="legend" id="legend"></div>
    <aside class="drawer" id="drawer" aria-label="Informe de la tarea"></aside>
  </main>
</div>
<script src="shared.js"></script>
<script>
const { PROJECTS, AIS, state, tasksOf, esc, counts, tasksOfProject } = U;
const canvas = document.getElementById('canvas');
const APPROVE = '#e89a0c', INK = '#fbf8f1';

function station(x, cx, cy, big) {
  const th = U.threadOf(x.thread), ai = AIS[x.ai], r = big ? 11 : 9;
  const s = x.state;
  let g = '';
  if (s === 'done') g = `<circle class="ring" cx="${cx}" cy="${cy}" r="${r}" fill="${th.color}" stroke="${INK}" stroke-width="3"/><path d="M${cx - 4} ${cy}l3 3 5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  if (s === 'todo') g = `<circle class="ring" cx="${cx}" cy="${cy}" r="${r}" fill="${INK}" stroke="${th.color}" stroke-width="3"/>`;
  if (s === 'proposed') g = `<circle class="ring" cx="${cx}" cy="${cy}" r="${r}" fill="${INK}" stroke="${th.color}" stroke-width="2.5" stroke-dasharray="3.5 3"/>`;
  if (s === 'blocked') g = `<circle class="ring" cx="${cx}" cy="${cy}" r="${r}" fill="#e5decf" stroke="#b9afa0" stroke-width="3"/><path d="M${cx - 4} ${cy}h8" stroke="#6c6353" stroke-width="2" stroke-linecap="round"/>`;
  if (s === 'running') g = `<circle class="pulse" cx="${cx}" cy="${cy}" r="${r + 3}" fill="${ai.color}"/>
    <circle class="ring" cx="${cx}" cy="${cy}" r="${r}" fill="${ai.fill}" stroke="${INK}" stroke-width="2.5"/>
    <text x="${cx}" y="${cy + 4}" text-anchor="middle" style="fill:#fff;font-size:11px">${ai.glyph}</text>`;
  if (s === 'review') g = `<rect class="ring" x="${cx - r}" y="${cy - r}" width="${r * 2}" height="${r * 2}" rx="3.5" fill="${APPROVE}" stroke="${INK}" stroke-width="2.5" transform="rotate(45 ${cx} ${cy})"/><text x="${cx}" y="${cy + 4.5}" text-anchor="middle" style="fill:#241700;font-size:12.5px;font-weight:800">!</text>`;
  const sel = state.openTask === x.id ? `<circle cx="${cx}" cy="${cy}" r="${r + 7}" fill="none" stroke="#221d15" stroke-width="1.5"/>` : '';
  return `<g class="hit" data-task="${x.id}" tabindex="0" role="button" aria-label="${x.id} ${esc(x.title)}, ${U.STATES[s].label}">${sel}<circle cx="${cx}" cy="${cy}" r="${r + 10}" fill="transparent"/>${g}</g>`;
}

/* Recorta el nombre de la fase si su columna es estrecha. */
const fitLabel = (txt, w) => { const max = Math.floor((w - 24) / 6.6); return txt.length > max ? txt.slice(0, Math.max(3, max - 1)) + '…' : txt; };

function lineBlock(p, detailed) {
  const W = canvas.clientWidth - 48;
  const nameW = 96, rowH = detailed ? 112 : 76, topH = detailed ? 50 : 26;
  /* Ancho de cada fase: el máximo de tareas que tiene ahí un hilo. */
  const widths = p.phases.map((_, i) => Math.max(1, ...p.threads.map((th) => tasksOf(th.id).filter((x) => x.phase === i).length)));
  const total = widths.reduce((a, b) => a + b, 0);
  const step = Math.max(78, Math.min(detailed ? 150 : 120, (W - nameW - 40) / total));
  const phaseX = []; let acc = nameW + 26;
  widths.forEach((w) => { phaseX.push(acc); acc += w * step; });
  const width = acc + 10, height = topH + p.threads.length * rowH + (detailed ? 16 : 0), trunkY = 12;
  let s = `<path d="M0 ${trunkY}H${width}" stroke="${p.color}" stroke-width="7" stroke-linecap="round"/>`;
  if (detailed) p.phases.forEach((ph, i) => {
    s += `<path d="M${phaseX[i] - 12} ${trunkY}V${height}" stroke="#c9bea9" stroke-width="1" stroke-dasharray="2 4"/><text class="ph-l" x="${phaseX[i] - 6}" y="${trunkY + 22}">${i + 1}. ${esc(fitLabel(ph, widths[i] * step))}</text>`;
  });
  p.threads.forEach((th, ti) => {
    const y = topH + ti * rowH + (detailed ? 22 : 16), list = tasksOf(th.id), ai = AIS[th.ai];
    const used = {};
    const xs = list.map((x) => { const k = used[x.phase] || 0; used[x.phase] = k + 1; return phaseX[x.phase] + k * step + step / 2 - 12; });
    const branchX = nameW + ti * 9 - 8, last = xs[xs.length - 1];
    let lastDone = -1; list.forEach((x, i) => { if (x.state === 'done') lastDone = i; });
    const litEnd = lastDone >= 0 ? xs[lastDone] : branchX + 14;
    const active = state.thread === th.id;
    s += `<path d="M${branchX} ${trunkY}V${y - 14}Q${branchX} ${y} ${branchX + 14} ${y}H${last}" fill="none" stroke="${th.color}" stroke-width="${active ? 6 : 5}" opacity=".3" stroke-linecap="round"/>`;
    s += `<path d="M${branchX} ${trunkY}V${y - 14}Q${branchX} ${y} ${branchX + 14} ${y}H${litEnd}" fill="none" stroke="${th.color}" stroke-width="${active ? 6 : 5}" stroke-linecap="round"/>`;
    s += `<g data-thread="${th.id}" style="cursor:pointer"><text class="th-n" x="0" y="${y - 2}" style="fill:color-mix(in srgb,${th.color} 68%,#000)">${active ? '› ' : ''}${esc(th.name)}</text>
      <text x="0" y="${y + 14}" style="font-size:11px;fill:${ai.fill}">${ai.glyph} ${esc(th.model)}</text></g>`;
    list.forEach((x, i) => {
      s += station(x, xs[i], y, detailed);
      s += `<text class="id" x="${xs[i]}" y="${y - 17}" text-anchor="middle">${x.id}</text>`;
      const flag = x.state === 'review' || x.state === 'running';
      if (detailed || flag) {
        s += `<foreignObject x="${xs[i] - step / 2 + 2}" y="${y + 16}" width="${step - 4}" height="44"><div xmlns="http://www.w3.org/1999/xhtml" class="stn-label ${x.state === 'done' ? 'quiet' : ''} ${flag ? 'flag' : ''}">${esc(x.title)}</div></foreignObject>`;
      }
    });
  });
  const c = counts(tasksOfProject(p));
  return `<section class="line-block" style="--p:${p.color}">
    <div class="line-title"><button data-p="${p.id}">${esc(p.name)}</button>
      <span>${c.done} de ${c.total} estaciones${c.running ? ` · ${c.running} en ejecución` : ''}${c.approve ? ` · ${c.approve} por aprobar` : ''}</span></div>
    <svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${s}</svg>
  </section>`;
}

function render() {
  const top = canvas.scrollTop, left = canvas.scrollLeft;
  const all = state.project === 'all';
  canvas.innerHTML = `<div class="map">${(all ? PROJECTS : PROJECTS.filter((p) => p.id === state.project)).map((p) => lineBlock(p, !all)).join('')}</div>`;
  canvas.scrollTop = top; canvas.scrollLeft = left;
}
canvas.addEventListener('click', (e) => {
  const n = e.target.closest('[data-p],[data-thread],[data-task]'); if (!n) return;
  if (n.dataset.p) U.selectProject(n.dataset.p);
  if (n.dataset.thread) U.selectThread(n.dataset.thread);
  if (n.dataset.task) U.openTask(n.dataset.task);
});
canvas.addEventListener('keydown', (e) => { const n = e.target.closest('[data-task]'); if (n && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); U.openTask(n.dataset.task); } });
U.on((k) => { if (k !== 'tick') render(); });
U.mountChat(document.getElementById('chat'));
U.mountTabs(document.getElementById('tabs'));
U.mountDrawer(document.getElementById('drawer'));
document.getElementById('legend').innerHTML = U.legend();
render();
addEventListener('resize', render);
</script>
</body>
</html>
