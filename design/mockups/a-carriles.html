<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unificador · A · Carriles</title>
<link rel="stylesheet" href="shared.css">
<style>
:root {
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; --mono: "Cascadia Mono", Consolas, monospace;
  --bg: #0e1014; --bg-2: #171a20; --panel: #12141a; --bubble: #232730;
  --ink: #e9ebf0; --ink-2: #9aa2b1; --ink-3: #565e6d; --line: #252932; --line-2: #3a404d;
  --approve: #f5b83d; --approve-ink: #241700; --plus: #4ad991; --minus: #ff7d7d; --chat-w: 390px; --focus: #fff;
}
/* El color de la IA pinta el borde del panel y una franja superior. */
.chat { border-right: 1px solid var(--line); box-shadow: inset 0 3px 0 var(--ai); transition: box-shadow .25s; }
.chat::after { content: ''; position: absolute; inset: 0 0 auto 0; height: 130px; pointer-events: none; background: linear-gradient(color-mix(in srgb, var(--ai) 15%, transparent), transparent); transition: background .25s; }
.chat > * { position: relative; z-index: 1; }
.providers { background: var(--bg-2); border-radius: 10px; padding: 3px; }
.topbar { border-bottom: 1px solid var(--line); }
.legend { border-top: 1px solid var(--line); }

/* Vista de todos */
.all { padding: 14px; display: grid; gap: 12px; }
.pj { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; }
.pj-head { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; text-align: left; border-left: 4px solid var(--p); }
.pj-head:hover { background: color-mix(in srgb, var(--p) 10%, transparent); }
.pj-head h2 { font-size: 15px; }
.pj-count { margin-left: auto; font-size: 12px; color: var(--ink-2); display: flex; gap: 12px; align-items: center; white-space: nowrap; }
.bar { width: 90px; height: 5px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--p); }
.lane { display: grid; grid-template-columns: 136px minmax(0, 1fr); align-items: center; border-top: 1px solid var(--line); }
.lane.active { background: color-mix(in srgb, var(--th) 11%, transparent); }
.lane-name { display: flex; align-items: center; gap: 7px; padding: 8px 8px 8px 14px; text-align: left; font-size: 13px; font-weight: 600; min-width: 0; }
.lane-name span.n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lane-name .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--th); flex: none; }
.lane-name .ai { color: var(--ai); font-size: 11px; }
.seq { display: flex; align-items: center; padding: 6px 10px 6px 0; min-width: 0; overflow: hidden; position: relative; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 4px 8px; border-radius: 7px; font-size: 12px; white-space: nowrap; flex: 0 1 auto; min-width: 0; background: var(--bg-2); border: 1px solid var(--line); }
.chip:hover { border-color: var(--th); }
.chip .tt { overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
.chip b { font-family: var(--mono); font-weight: 500; font-size: 11px; }
.chip.is-done { background: color-mix(in srgb, var(--th) 16%, var(--bg-2)); border-color: transparent; }
.chip.is-done .tt { display: none; }
.chip.is-running { border-color: var(--ai); box-shadow: 0 0 0 1px color-mix(in srgb, var(--ai) 40%, transparent); }
.chip.is-running .tt, .chip.is-review .tt { color: var(--ink); }
.chip.is-review { border-color: var(--approve); background: color-mix(in srgb, var(--approve) 14%, var(--bg-2)); }
.chip.is-proposed { border-style: dashed; border-color: var(--line-2); background: none; }
.chip.is-blocked, .chip.is-todo { background: none; }
.chip.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.link-l { width: 12px; height: 2px; flex: none; background: var(--th); opacity: .6; }

/* Vista de proyecto: fases en columnas, hilos en filas */
.matrix { display: grid; min-width: max-content; padding: 0 14px 14px; }
.ph { position: sticky; top: 0; z-index: 3; padding: 10px 8px 8px; font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--bg); border-bottom: 2px solid var(--p); }
.ph small { display: block; font-weight: 400; color: var(--ink-3); }
.ph.corner { left: 0; z-index: 4; }
.rowhead { position: sticky; left: 0; z-index: 2; background: var(--bg); padding: 12px 10px 12px 0; border-bottom: 1px solid var(--line); font-weight: 600; }
.rowhead .btn { display: flex; gap: 7px; align-items: center; text-align: left; }
.rowhead .sw { width: 11px; height: 11px; border-radius: 3px; background: var(--th); flex: none; }
.rowhead .sub { display: block; margin-top: 3px; font-size: 12px; color: var(--ai); font-weight: 500; }
.rowhead.active .btn { color: var(--th); }
.cell { padding: 8px; border-bottom: 1px solid var(--line); border-left: 1px dashed var(--line); display: flex; flex-direction: column; gap: 6px; }
.tk { width: 156px; text-align: left; display: grid; gap: 5px; padding: 9px 10px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--th); border-radius: 8px; }
.tk:hover { background: var(--bg-2); }
.tk .top { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-2); }
.tk .top b { font-family: var(--mono); font-weight: 500; }
.tk .top .a { margin-left: auto; color: var(--ai); }
.tk .ti { font-size: 13px; font-weight: 600; line-height: 1.25; }
.tk.is-done { background: color-mix(in srgb, var(--th) 10%, var(--panel)); }
.tk.is-done .ti { color: var(--ink-2); font-weight: 500; }
.tk.is-proposed { border-style: dashed; border-left-style: solid; background: none; }
.tk.is-blocked { background: none; opacity: .72; }
.tk.is-review { border-color: var(--approve); border-left-color: var(--th); background: color-mix(in srgb, var(--approve) 10%, var(--panel)); }
.tk.is-running { border-color: var(--ai); border-left-color: var(--th); }
.tk .prog { height: 3px; border-radius: 2px; background: var(--line-2); overflow: hidden; }
.tk .prog i { display: block; height: 100%; background: var(--ai); animation: pulse 1.4s infinite; }
.tk.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
</style>
</head>
<body>
<div class="app">
  <aside class="chat" id="chat" aria-label="Chat"></aside>
  <main class="stage">
    <div class="topbar" id="tabs"></div>
    <div class="canvas" id="canvas"></div>
    <div class="legend" id="legend"></div>
    <aside class="drawer" id="drawer" aria-label="Informe de la tarea"></aside>
  </main>
</div>
<script src="shared.js"></script>
<script>
const { PROJECTS, AIS, state, tasksOf, esc, counts, tasksOfProject } = U;
const canvas = document.getElementById('canvas');

function allView() {
  return `<div class="all">${PROJECTS.map((p) => {
    const c = counts(tasksOfProject(p));
    return `<section class="pj" style="--p:${p.color}">
      <button class="pj-head" data-p="${p.id}">
        <h2>${esc(p.name)}</h2>
        <span class="pj-count">
          ${c.running ? `<span>${c.running} en ejecución</span>` : ''}
          ${c.approve ? `<span class="tally"><span class="st st-review">!</span>${c.approve}</span>` : ''}
          <span>${c.done}/${c.total}</span><span class="bar"><i style="width:${c.done / c.total * 100}%"></i></span>
        </span>
      </button>
      ${p.threads.map((th) => `<div class="lane ${state.thread === th.id ? 'active' : ''}" style="--th:${th.color};--ai:${AIS[th.ai].color}">
        <button class="lane-name" data-thread="${th.id}"><span class="sw"></span><span class="n">${esc(th.name)}</span><span class="ai" title="${AIS[th.ai].name}">${AIS[th.ai].glyph}</span></button>
        <div class="seq">${tasksOf(th.id).map((x, i) => `${i ? '<span class="link-l"></span>' : ''}<button class="chip is-${x.state} ${state.openTask === x.id ? 'sel' : ''}" data-task="${x.id}" title="${esc(x.title)}" style="--ai:${AIS[x.ai].color}">${U.mark(x)}<b>${x.id}</b><span class="tt">${esc(x.title)}</span></button>`).join('')}</div>
      </div>`).join('')}
    </section>`;
  }).join('')}</div>`;
}

function projectView(p) {
  const cols = `118px repeat(${p.phases.length}, max-content)`;
  let html = `<div class="matrix" style="--p:${p.color};grid-template-columns:${cols}"><div class="ph corner">Hilos</div>`;
  p.phases.forEach((ph, i) => {
    const list = tasksOfProject(p).filter((x) => x.phase === i), done = list.filter((x) => x.state === 'done').length;
    html += `<div class="ph">Fase ${i + 1} · ${esc(ph)}<small>${done} de ${list.length} hechas</small></div>`;
  });
  p.threads.forEach((th) => {
    html += `<div class="rowhead ${state.thread === th.id ? 'active' : ''}" style="--th:${th.color};--ai:${AIS[th.ai].color}">
      <button class="btn" data-thread="${th.id}"><span class="sw"></span>${esc(th.name)}</button>
      <span class="sub">${AIS[th.ai].glyph} ${esc(th.model)}</span></div>`;
    p.phases.forEach((_, i) => {
      html += `<div class="cell" style="--th:${th.color}">${tasksOf(th.id).filter((x) => x.phase === i).map((x) =>
        `<button class="tk is-${x.state} ${state.openTask === x.id ? 'sel' : ''}" data-task="${x.id}" style="--ai:${AIS[x.ai].color}">
          <span class="top">${U.mark(x)}<b>${x.id}</b><span class="a">${AIS[x.ai].glyph}</span></span>
          <span class="ti">${esc(x.title)}</span>
          ${x.state === 'running' ? `<span class="prog"><i style="width:${(x.phaseIdx + 1) * 20}%"></i></span>` : ''}
        </button>`).join('')}</div>`;
    });
  });
  return html + '</div>';
}

function render() {
  const top = canvas.scrollTop, left = canvas.scrollLeft;
  canvas.innerHTML = state.project === 'all' ? allView() : projectView(PROJECTS.find((p) => p.id === state.project));
  canvas.scrollTop = top; canvas.scrollLeft = left;
}
canvas.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.p) U.selectProject(b.dataset.p);
  if (b.dataset.thread) U.selectThread(b.dataset.thread);
  if (b.dataset.task) U.openTask(b.dataset.task);
});
U.on((k) => { if (k !== 'tick') render(); });
U.mountChat(document.getElementById('chat'));
U.mountTabs(document.getElementById('tabs'));
U.mountDrawer(document.getElementById('drawer'));
document.getElementById('legend').innerHTML = U.legend();
render();
</script>
</body>
</html>
