<style>
/* 3 · Órbitas: zoom por niveles. Proyectos como soles, ramas como planetas; eliges un planeta y se abre al lado. */
#root{background:radial-gradient(900px 500px at 15% 0,#ece8ff,transparent),radial-gradient(800px 500px at 100% 100%,#ffe9f3,transparent),var(--bg)}
.o-all{display:flex;flex-wrap:wrap;justify-content:center;gap:30px 50px;padding:40px 20px}
.o-sys{width:300px;text-align:center;cursor:pointer;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--n)*120ms)}
@keyframes pop{from{opacity:0;scale:.6}}
.o-sky{position:relative;width:280px;height:280px;margin:auto}
.o-orbit{position:absolute;inset:14px;border:2px dashed color-mix(in srgb,var(--c) 35%,#fff);border-radius:50%;animation:spin 40s linear infinite}
.o-sys:hover .o-orbit,.o-sys:hover .o-sat span{animation-duration:10s}
@keyframes spin{to{rotate:360deg}}
.o-sat{position:absolute;left:50%;top:50%;width:0;height:0;rotate:var(--a)}
.o-sat span{position:absolute;left:-23px;top:-149px;width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:21px;
box-shadow:var(--shadow);border:3.5px solid var(--bc);animation:spin 40s linear infinite reverse;rotate:calc(-1*var(--a))}
.o-sat.on span{box-shadow:0 0 0 6px color-mix(in srgb,var(--bc) 25%,transparent),var(--shadow)}
.o-sun{position:absolute;inset:66px;display:grid;place-items:center}.o-sun .ring{box-shadow:var(--up)}
.o-sys h2{margin:10px 0 4px;font-size:20px}.o-sys .now{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.o-proj{display:grid;grid-template-columns:minmax(360px,1fr) minmax(340px,480px);gap:10px;min-height:100%}
.o-map{position:relative;min-height:560px}
.o-map svg{position:absolute;inset:0;width:100%;height:100%}
.o-pl{position:absolute;translate:-50% -50%;text-align:center;width:150px;transition:scale .3s cubic-bezier(.2,.9,.3,1.4);animation:float 6s ease-in-out infinite;animation-delay:calc(var(--n)*-1.3s)}
@keyframes float{50%{margin-top:-10px}}
.o-pl .ring{margin:auto;box-shadow:var(--shadow);font-size:30px!important;cursor:pointer}
.o-pl.sel{scale:1.18}.o-pl.sel .ring{box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 22%,transparent),var(--up)}
.o-pl b{display:block;font-size:13.5px;margin-top:6px}.o-core{position:absolute;left:50%;top:50%;translate:-50% -50%;text-align:center;font-weight:800}
.o-core .ring{margin:auto}
.o-panel{background:var(--panel);border-radius:22px 0 0 22px;box-shadow:var(--up);padding:20px;border-top:6px solid var(--c);animation:inR .45s cubic-bezier(.2,.9,.3,1.1) both;overflow:auto}
@keyframes inR{from{opacity:0;translate:60px 0}}
.o-panel h2{margin:4px 0 2px}.o-phase{margin-top:16px;padding-left:16px;border-left:3px solid color-mix(in srgb,var(--c) 35%,#fff);display:grid;gap:8px;animation:inR .4s both;animation-delay:calc(var(--n)*90ms + 100ms)}
.o-phase.st-d{border-left-color:var(--ok)}.o-phase h4{margin:0;font-size:15px}
@media(max-width:820px){.o-proj{grid-template-columns:1fr}.o-map{min-height:430px}.o-panel{border-radius:22px 22px 0 0}}
</style>
<script>
let SEL = {};
// Anillo partido en fases: cada trozo se llena según sus pasos hechos.
function phaseRing(b, z) {
  const tot = bsteps(b).length; let a = 0, g = [];
  for (const ph of b.ph) { const w = flat(ph).length / tot * 360, f = (w - 6) * pct(flat(ph)) / 100;
    g.push(`${b.c} ${a}deg ${a + f}deg`, `#e3e6f2 ${a + f}deg ${a + w - 6}deg`, `transparent ${a + w - 6}deg ${a + w}deg`); a += w; }
  const r = ring(0, b.c, z, b.i);
  r.style.background = `radial-gradient(closest-side,#fff 74%,transparent 76%),conic-gradient(${g.join(",")})`; return r;
}
const DESIGN = { name: "3 · Órbitas",
  all(root) {
    root.append(h("div", { class: "o-all" }, DATA.map((p, n) => { const a = active(psteps(p)); return h("section", { class: "o-sys", css: { "--c": p.c, "--n": n }, on: { click: () => go(p.id) } },
      h("div", { class: "o-sky" }, h("div", { class: "o-orbit" }, p.br.map((b, i) => h("div", { class: "o-sat" + (active(bsteps(b)).length ? " on" : ""), title: b.n, css: { "--a": i * 360 / p.br.length + "deg", "--bc": b.c } }, h("span", {}, b.i)))),
        h("div", { class: "o-sun" }, ring(pct(psteps(p)), p.c, 148, h("span", {}, p.i, h("br"), pct(psteps(p)) + "%")))),
      h("h2", {}, p.n), h("span", { class: "tag" }, `${p.br.length} ramas · ${a.length} pasos en marcha`),
      h("div", { class: "now" }, a.slice(0, 3).map((s) => chip(s.cat, cut(s.t, 24))))); })));
  },
  project(root, p) {
    const sel = p.br.find((b) => b.id === SEL[p.id]) || p.br.find((b) => active(bsteps(b)).length) || p.br[0];
    const pos = (i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / p.br.length + .5; return [50 + 33 * Math.cos(a), 50 + 34 * Math.sin(a)]; };
    let lines = "";
    p.br.forEach((b, i) => { const [x, y] = pos(i); lines += `<line x1="50%" y1="50%" x2="${x}%" y2="${y}%" stroke="${b.c}" stroke-width="3" opacity=".3"/>`;
      for (const ph of b.ph) if (ph.needs) { const t = findPh(p, ph.needs), [x2, y2] = pos(p.br.indexOf(t.b)), ok = phSt(t) === "d";
        lines += `<line x1="${x2}%" y1="${y2}%" x2="${x}%" y2="${y}%" stroke="${ok ? "#1fa971" : "#f59e0b"}" stroke-width="3" stroke-dasharray="4 8" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/></line>`; } });
    const map = h("div", { class: "o-map", html: `<svg>${lines}</svg>` },
      h("div", { class: "o-core" }, ring(pct(psteps(p)), p.c, 92, p.i), p.n),
      p.br.map((b, i) => { const [x, y] = pos(i); return h("div", { class: "o-pl" + (b === sel ? " sel" : ""), css: { "--c": b.c, "--n": i }, style: { left: x + "%", top: y + "%" },
        on: { click: () => { SEL[p.id] = b.id; document.startViewTransition ? document.startViewTransition(render) : render(); } } },
        phaseRing(b, 96), h("b", {}, b.n), h("span", { class: "tag" }, pct(bsteps(b)) + "% · " + b.ph.length + " fases")); }));
    const panel = h("aside", { class: "o-panel", css: { "--c": sel.c } }, h("span", { class: "eyebrow" }, "Rama"), h("h2", {}, sel.i + " " + sel.n), seg(sel), h("div", { style: { height: "8px" } }), mix(bsteps(sel)),
      sel.ph.map((ph, k) => h("div", { class: "o-phase st-" + phSt(ph), css: { "--n": k } }, h("span", { class: "eyebrow" }, `Fase ${k + 1} de ${sel.ph.length}`), h("h4", {}, ph.n), lock(p, ph), ph.steps.map((x) => slot(x)))));
    root.append(h("div", { class: "o-proj" }, map, panel));
  } };
</script>
