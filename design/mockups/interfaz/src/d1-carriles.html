<style>
/* 1 · Carriles: cada rama es una fila; el tiempo va de izquierda a derecha y se arrastra de lado. */
.c-wrap{position:relative;padding:20px 40px 80px 18px;min-width:max-content}
.lane{display:flex;align-items:stretch;margin-bottom:16px;animation:inL .55s both;animation-delay:calc(var(--n)*90ms)}
@keyframes inL{from{opacity:0;translate:-40px 0}}
.lane-h{position:sticky;left:0;z-index:3;width:200px;flex:none;background:var(--panel);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);
border-top:5px solid var(--c);margin-right:22px;display:flex;flex-direction:column;gap:8px}
.lane-h b{font-size:15px}.lane-h .row{display:flex;gap:10px;align-items:center}
.ph{background:color-mix(in srgb,var(--c) 7%,#fff);border:1.5px solid color-mix(in srgb,var(--c) 28%,#fff);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ph.st-p{border-style:dashed;background:#fbfbfe}.ph.st-d{opacity:.75}
.ph-t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.ph-t b{font-size:14.5px}
.ph-steps{display:flex;gap:8px;align-items:center;flex:1}.ph-steps>*{width:215px}
.arrow{align-self:center;width:30px;height:3px;background:var(--c);flex:none;opacity:.5;position:relative}
.arrow::after{content:"";position:absolute;right:-2px;top:-4px;border:5.5px solid transparent;border-left-color:var(--c)}
.c-all{padding:20px;display:grid;gap:16px;max-width:1000px;margin:auto}
.c-proj{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px;cursor:pointer;border-left:6px solid var(--c);animation:inL .5s both;animation-delay:calc(var(--n)*90ms);transition:box-shadow .2s,translate .2s}
.c-proj:hover{box-shadow:var(--up);translate:0 -2px}
.c-proj header{display:flex;gap:14px;align-items:center;margin-bottom:10px}.c-proj h2{margin:0;font-size:19px}
.c-row{display:grid;grid-template-columns:190px 1fr 1.4fr;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.c-now{display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:760px){.c-row{grid-template-columns:1fr}.lane-h{width:150px}}
</style>
<script>
const DESIGN = { name: "1 · Carriles",
  all(root) {
    root.append(h("div", { class: "c-all" }, DATA.map((p, n) => h("section", { class: "c-proj", css: { "--c": p.c, "--n": n }, on: { click: () => go(p.id) } },
      h("header", {}, ring(pct(psteps(p)), p.c, 56), h("div", {}, h("h2", {}, p.i + " " + p.n),
        h("span", { class: "tag" }, `${p.br.length} ramas · ${active(psteps(p)).length} pasos en marcha`))),
      p.br.map((b) => { const a = active(bsteps(b)); return h("div", { class: "c-row" }, h("b", {}, b.i + " " + b.n), seg(b),
        h("div", { class: "c-now" }, a.map((s) => chip(s.cat, cut(s.t, 30))), !a.length && h("span", { class: "tag" }, pct(bsteps(b)) === 100 ? "✔ Terminada" : "En espera"))); })))));
  },
  project(root, p) {
    const w = h("div", { class: "c-wrap" }, p.br.map((b, n) => h("div", { class: "lane", css: { "--c": b.c, "--n": n } },
      h("div", { class: "lane-h" }, h("span", { class: "eyebrow" }, "Rama"), h("div", { class: "row" }, ring(pct(bsteps(b)), b.c, 42), h("b", {}, b.i + " " + b.n)), seg(b), mix(bsteps(b))),
      b.ph.map((ph, k) => [k > 0 && h("i", { class: "arrow" }),
        h("div", { class: "ph st-" + phSt(ph), "data-ph": ph.key, "data-needs": ph.needs },
          h("div", { class: "ph-t" }, h("span", { class: "eyebrow" }, "Fase " + (k + 1)), h("b", {}, ph.n), lock(p, ph)),
          h("div", { class: "ph-steps" }, ph.steps.map((x) => slot(x))))]))));
    root.append(w); pan(root); depsSoon(w, p, "h");
  } };
</script>
