<style>
/* 5 · Línea del ahora: columnas por rama alineadas en una raya. Arriba lo hecho, abajo lo que viene. Se desliza en vertical. */
.n-wrap{position:relative;padding:0 18px 120px;min-width:max-content}
.n-grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(270px,330px));gap:0 20px;justify-content:center}
.n-heads{position:sticky;top:0;z-index:4;padding:12px 0 10px;background:linear-gradient(var(--bg) 85%,transparent)}
.n-head{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;display:flex;gap:10px;align-items:center;border-bottom:4px solid var(--c)}
.n-head b{font-size:14.5px;display:block}.n-head .seg{margin-top:5px;width:150px}
.n-past{align-items:end;padding-top:20px}.n-fut{align-items:start}
.n-col{border-left:4px solid var(--c);padding:8px 0 8px 14px;display:grid;gap:10px;position:relative}
.n-past .n-col{border-left-color:color-mix(in srgb,var(--c) 40%,#fff);animation:up .6s both}
.n-fut .n-col{animation:down .6s both;animation-delay:calc(var(--n)*80ms)}
@keyframes up{from{opacity:0;translate:0 -30px}}@keyframes down{from{opacity:0;translate:0 40px}}
.n-mini{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--muted);padding:2px 0;cursor:pointer;transition:opacity .25s}
.n-mini i{width:16px;height:16px;border-radius:50%;background:var(--k);color:#fff;font-size:10px;display:grid;place-items:center;font-style:normal;flex:none}
.n-pt{font-size:12px;font-weight:800;color:var(--ink);opacity:.7}
.n-line{position:sticky;top:78px;z-index:3;height:0;border-top:3px solid var(--ai);margin:6px -18px;box-shadow:0 0 18px 2px rgba(108,92,231,.45)}
.n-line span{position:absolute;left:18px;top:-13px;background:var(--ai);color:#fff;font-size:11.5px;font-weight:800;letter-spacing:.06em;padding:4px 12px;border-radius:99px}
.n-ph{background:var(--panel);border-radius:16px;padding:11px 12px;display:grid;gap:8px;box-shadow:var(--shadow);border:1.5px solid color-mix(in srgb,var(--c) 22%,#fff)}
.n-ph.st-p{background:transparent;box-shadow:none;border-style:dashed;border-color:#cfd4e6}
.n-ph h4{margin:0;font-size:14.5px}.n-col::before{content:"";position:absolute;left:-9px;top:14px;width:14px;height:14px;border-radius:50%;background:var(--c);border:3px solid var(--bg)}
.n-all{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,360px));gap:20px;padding:24px;justify-content:center;align-items:start}
.n-pj{background:var(--panel);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;animation:down .5s both;animation-delay:calc(var(--n)*100ms);transition:translate .2s,box-shadow .2s}
.n-pj:hover{translate:0 -3px;box-shadow:var(--up)}
.n-pj header{display:flex;gap:12px;align-items:center;padding:14px 16px}.n-pj h2{margin:0;font-size:19px}
.n-z{padding:10px 16px;display:grid;gap:7px}.n-z.past{background:#f1f9f5;color:#12704a;font-weight:700;font-size:13px}
.n-z.now{border-top:3px solid var(--c);border-bottom:1px dashed var(--line)}.n-z.next .n-mini i{background:var(--soft);border:2px solid var(--k)}
</style>
<script>
const allDone = (x) => [x].flat().every((s) => s.st === "d");
const mini = (s, txt) => h("div", { class: "n-mini", "data-cat": s.cat, css: { "--k": CATS[s.cat].c }, on: { click: (e) => { e.stopPropagation(); sheet(s); } } }, h("i", {}, s.st === "d" ? "✓" : ""), txt ?? s.t);
const DESIGN = { name: "5 · Línea del ahora",
  all(root) {
    root.append(h("div", { class: "n-all" }, DATA.map((p, n) => { const l = psteps(p), a = active(l), nx = p.br.map((b) => bsteps(b).find((s) => s.st === "p")).filter(Boolean);
      return h("section", { class: "n-pj", css: { "--c": p.c, "--n": n }, on: { click: () => go(p.id) } },
        h("header", {}, ring(pct(l), p.c, 54), h("div", {}, h("h2", {}, p.i + " " + p.n), h("span", { class: "tag" }, p.br.map((b) => b.i).join(" ")))),
        h("div", { class: "n-z past" }, `✔ ${l.filter((s) => s.st === "d").length} pasos hechos`),
        h("div", { class: "n-z now" }, h("span", { class: "eyebrow" }, "Ahora"), a.map((s) => stepCard(s, true)), !a.length && h("span", { class: "tag" }, "Nada en marcha")),
        h("div", { class: "n-z next" }, h("span", { class: "eyebrow" }, "Después"), nx.slice(0, 3).map((s) => mini(s, s._b.i + " " + s.t)))); })));
  },
  project(root, p) {
    const cols = { "--cols": p.br.length };
    const heads = h("div", { class: "n-grid n-heads", css: cols }, p.br.map((b) => h("div", { class: "n-head", css: { "--c": b.c } }, ring(pct(bsteps(b)), b.c, 40), h("div", {}, h("b", {}, b.i + " " + b.n), seg(b)))));
    const past = h("div", { class: "n-grid n-past", css: cols }, p.br.map((b) => h("div", { class: "n-col", css: { "--c": b.c } },
      b.ph.map((ph) => { const d = ph.steps.filter(allDone).flat(); return d.length ? h("div", {}, h("div", { class: "n-pt" }, ph.n + (phSt(ph) === "d" ? " · fase cerrada ✔" : "")), d.map((s) => mini(s))) : null; }))));
    const fut = h("div", { class: "n-grid n-fut", css: cols }, p.br.map((b, n) => h("div", { class: "n-col", css: { "--c": b.c, "--n": n } },
      b.ph.map((ph, k) => { const r = ph.steps.filter((x) => !allDone(x)); return r.length ? h("div", { class: "n-ph st-" + phSt(ph), "data-ph": ph.key, "data-needs": ph.needs },
        h("span", { class: "eyebrow" }, `Fase ${k + 1} de ${b.ph.length}`), h("h4", {}, ph.n), lock(p, ph), r.map((x) => slot(x))) : null; }),
      pct(bsteps(b)) === 100 && h("span", { class: "tag" }, "✔ Rama terminada"))));
    const line = h("div", { class: "n-line" }, h("span", {}, "AHORA · 12 nov"));
    const w = h("div", { class: "n-wrap" }, heads, past, line, fut);
    root.append(w); pan(root); depsSoon(w, p, "v");
  } };
</script>
