<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unificador</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>
  <div class="layout">
    <main id="main" tabindex="-1">
      <!-- Portada: todos los proyectos -->
      <section id="home" aria-labelledby="home-title" hidden>
        <header class="top">
          <div class="top-title">
            <h1 id="home-title">Tus proyectos</h1>
            <p class="muted">Tu agente trabaja en su propio programa; aquí ves cómo va todo y decides lo que te toca.</p>
          </div>
        </header>
        <div id="projects" class="projects"></div>
      </section>

      <!-- Tablero de un proyecto: cabecera, lienzo y bandeja de decisiones -->
      <section id="board" aria-labelledby="project-name" hidden>
        <h1 id="project-name" class="sr-only">Unificador</h1>
        <header class="tb">
          <label class="pick"><span class="pick-l">Proyecto</span>
            <select id="project-select" aria-label="Proyecto"></select></label>
          <div class="total" id="total" hidden>
            <strong id="total-text"></strong>
            <div class="bar"><i id="total-bar"></i></div>
          </div>
          <div id="legend" class="legend" role="group" aria-label="Filtrar por categoría"></div>
          <button type="button" id="decb" class="decb" aria-controls="drawer" aria-expanded="false"></button>
        </header>
        <p id="project-sub" class="muted sub"></p>
        <div class="canvas-wrap">
          <div id="canvas" class="canvas" tabindex="0" role="region" aria-label="Plan del proyecto. Con el teclado: más, menos y cero para el zoom.">
            <div id="sizer" class="sizer"><div id="branches" class="m-box"></div></div>
          </div>
          <div class="zoom" role="group" aria-label="Zoom del plan">
            <button type="button" id="z-out" aria-label="Alejar"></button>
            <span id="z-label" aria-live="polite">100%</span>
            <button type="button" id="z-in" aria-label="Acercar"></button>
            <button type="button" id="z-fit" aria-label="Ajustar el plan a la pantalla"></button>
          </div>
        </div>
        <div id="scrim" class="scrim" hidden></div>
        <aside id="drawer" class="drawer" role="dialog" aria-label="Decisiones" hidden>
          <div class="dh"><h2>Decisiones</h2><button type="button" id="drawer-close" class="x" aria-label="Cerrar las decisiones"></button></div>
          <div class="dbody">
            <p id="drawer-empty" class="muted" hidden>Nada te espera ahora mismo.</p>
            <section id="inbox" class="inbox" aria-label="Te toca" hidden></section>
            <div id="decided"></div>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <dialog id="viewer" class="viewer" aria-labelledby="v-title">
    <div class="v-bar">
      <div class="v-info">
        <strong id="v-title"></strong>
        <span id="v-count" class="muted"></span>
      </div>
      <div class="v-tools">
        <div class="v-widths" role="group" aria-label="Ancho de la vista">
          <button type="button" class="pill" data-w="390">📱 Móvil</button>
          <button type="button" class="pill" data-w="820">Tableta</button>
          <button type="button" class="pill" data-w="1280">🖥️ Escritorio</button>
        </div>
        <button type="button" class="pill icon" id="v-prev" aria-label="Propuesta anterior">←</button>
        <button type="button" class="pill icon" id="v-next" aria-label="Propuesta siguiente">→</button>
        <button type="button" class="pill primary" id="v-pick">Elegir esta</button>
        <button type="button" class="pill icon" id="v-close" aria-label="Cerrar">✕</button>
      </div>
    </div>
    <div class="v-stage" id="v-stage"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
