<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unificador</title>
  <link rel="stylesheet" href="app.css">
</head>
<body data-tab="plan">
  <div class="layout">
    <aside id="chat" aria-label="Chat">
      <nav id="chat-rail" class="rail" aria-label="Agentes"></nav>
      <div class="chat-main">
        <div id="chat-bar" class="chat-bar"></div>
        <div id="chat-list" class="chat-list" hidden></div>
        <div id="chat-log" class="chat-log" role="log" aria-live="polite"></div>
        <div id="chat-toast" class="chat-toast" role="status" hidden></div>
        <form id="chat-form" class="composer">
          <textarea id="chat-input" rows="1" placeholder="Escribe aquí…" title="Enter envía · Shift+Enter salta de línea" aria-label="Mensaje"></textarea>
          <button id="chat-send" type="submit" data-mode="send">Enviar ➤</button>
        </form>
      </div>
    </aside>
    <main id="plan" aria-label="Plan del proyecto">
      <header class="top">
        <div class="top-title">
          <h1 id="project-name">Unificador</h1>
          <p id="project-sub" class="muted"></p>
        </div>
        <div class="total" id="total" hidden>
          <strong id="total-text"></strong>
          <div class="bar"><i id="total-bar"></i></div>
        </div>
      </header>
      <div id="branches"></div>
    </main>
  </div>
  <nav class="tabs" aria-label="Secciones">
    <button type="button" data-tab="plan" aria-pressed="true">🗺️ Plan</button>
    <button type="button" data-tab="chat" aria-pressed="false">💬 Chat</button>
  </nav>
  <script type="module" src="app.js"></script>
</body>
</html>
