<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unificador</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<main class="canvas" id="canvas">
  <div class="board" id="board">
    <div class="b-title"><h1 id="ptitle">Unificador</h1><span class="muted" id="psub"></span></div>
    <div class="grid" id="grid"><svg class="wires" id="wires"></svg></div>
  </div>
</main>

<header class="top">
  <button class="home-btn" id="homeBtn">▦ Mis proyectos</button>
  <span class="sep"></span>
  <span class="proj"><i id="pdot"></i><span id="pname">Elige un proyecto</span></span>
  <div class="pills">
    <span class="pill"><span class="st st-run"></span> <span id="nRun">0</span> trabajando</span>
    <button class="pill toca" id="tocaBtn"><span class="st st-toca"></span> Te toca revisar <b id="nToca">0</b></button>
    <button class="pill" id="gitBtn" aria-expanded="false" aria-controls="gitPanel">⎇ <span id="gitLbl">Versiones</span></button>
  </div>
  <div class="gitpanel" id="gitPanel" hidden role="dialog" aria-label="Versiones del proyecto"></div>
</header>

<footer class="legend">
  <span><span class="st st-pend"></span>Pendiente</span>
  <span><span class="st st-run"></span>Trabajando</span>
  <span><span class="st st-toca"></span>Te toca</span>
  <span><span class="st st-hecho" style="--r:#6b7280"></span>Hecho</span>
  <span class="sep"></span>
  <span><b>Rama</b> → <b>Fase</b> → <b>Paso</b> · Pulsa una fase para ver sus pasos</span>
</footer>

<aside class="chat" id="chat">
  <nav class="rail" aria-label="Inteligencia artificial"></nav>
  <div class="c-main">
    <div class="c-head"><div class="where" id="where"></div>
      <div class="convs">
        <select id="convSel" aria-label="Conversación"></select>
        <button id="newConv" title="Empezar una conversación nueva">＋ Nueva</button>
        <button id="nativeBtn" title="Seguir esta conversación en la aplicación del agente">Abrir ↗</button>
      </div>
    </div>
    <div class="ai-bar" hidden>
      <label>Modelo<select id="model"></select></label>
      <label>Esfuerzo<select><option>Bajo</option><option selected>Medio</option><option>Alto</option></select></label>
    </div>
    <div class="msgs" id="msgs" role="log" aria-live="polite" aria-label="Conversación">
    </div>
    <div class="compose">
      <span class="ctx" id="ctx"></span>
      <textarea id="ta" aria-label="Mensaje para la IA" placeholder="Escribe a Claude…"></textarea>
      <div class="send"><span id="sig"></span><button id="sendBtn">Enviar</button></div>
    </div>
  </div>
</aside>

<section class="home" id="home" aria-label="Mis proyectos">
  <div class="home-in">
    <h2>Mis proyectos</h2>
    <p class="muted">Elige uno para seguir donde lo dejaste.</p>
    <div class="cards" id="cards"></div>
  </div>
</section>

<script src="/app.js"></script>
</body>
</html>
